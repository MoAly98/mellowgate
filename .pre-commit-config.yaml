# Pre-commit hooks for code quality and formatting
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  # Ruff - fast Python linter and formatter (replaces black, isort, flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      # Run the linter
      - id: ruff
        name: ruff
        description: "Ruff: An extremely fast Python linter"
        args: [--fix]
        exclude: ^learning/
      # Run the formatter
      - id: ruff-format
        name: ruff-format
        description: "Ruff: An extremely fast Python formatter"
        exclude: ^learning/

  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace
        description: This hook trims trailing whitespace
        entry: trailing-whitespace-fixer
        language: python
        types: [text]
      - id: end-of-file-fixer
        name: fix end of files
        description: Ensures that a file is either empty or ends with one newline
        entry: end-of-file-fixer
        language: python
        types: [text]
      - id: check-merge-conflict
        name: check for merge conflicts
        description: Check for files that contain merge conflict strings
        entry: check-merge-conflict
        language: python
        types: [text]
      - id: check-yaml
        name: check yaml
        description: This hook checks yaml files for parseable syntax
        entry: check-yaml
        language: python
        types: [yaml]

  # MyPy type checking (disabled by default)
  # Uncomment and configure when ready for type checking
