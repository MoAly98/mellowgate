[project]
authors = [{name = "maly", email = "mohamed.aly@cern.ch"}]

name = "mellowgate"
requires-python = ">= 3.11,<=3.13"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "osx-64"]

[tool.pixi.pypi-dependencies]
mellowgate = { path = ".", editable = true }
sigmatch = "*"

[tool.pixi.tasks]

# Core runtime dependencies
[tool.pixi.dependencies]
jax = ">=0.7.0,<0.7.1"
flax = ">=0.10.2,<0.11"
matplotlib = ">=3.10.6,<4"
rich = "*"
pre-commit = "*"  # Needs to be in base for git hooks

# Test dependencies
[tool.pixi.feature.test.dependencies]
pytest = ">=8.4.2,<9"
pytest-cov = "*"
coverage = "*"

# Documentation dependencies
[tool.pixi.feature.docs.dependencies]
sphinx = ">=7"
furo = "*"
myst-parser = "<4"
myst-nb = "*"
sphinx-design = "*"
sphinx-autodoc-typehints = "*"
sphinxcontrib-mermaid = "*"
sphinx-copybutton = "*"
sphinx-togglebutton = "*"

# Development dependencies (includes test + docs)
[tool.pixi.feature.dev.dependencies]
ruff = "*"
jupyterlab = ">=4.4.9,<5"
mypy = "*"
ipython = "*"

# Define environments
[tool.pixi.environments]
default = ["test"]
test = ["test"]
docs = ["docs"]
dev = ["test", "docs", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=mellowgate",
    "--cov-report=term-missing",
    "--cov-fail-under=80"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

# Tool configurations
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
preview = true
ignore = [
    "PLR",     # Design related pylint codes
    "E501",    # Line too long
    "I002",    # isort: "from __future__ import annotations"
    "ISC001",  # flake8-implicit-str-concat
    "PLC0415", # `import` should be at the top-level of a file
    "PLW3201", # Dunder method has no special meaning in Python 3
    "RUF052",  # Local dummy variable is accessed
    "F722",    # jaxtyping annotations
    "PLW0108", # Lambda may be unnecessary (lambdas are clear in examples)
    "RUF003",  # Ambiguous unicode in comments (Greek letters intentional)
    "RUF002",  # Ambiguous unicode in docstrings (Greek letters intentional)
    "EM101",   # Exception string literals (too verbose to fix everywhere)
    "EM102",   # Exception f-string literals (too verbose to fix everywhere)
    "B904",    # raise ... from err (not critical for this project)
    "PTH",     # Use pathlib (not worth migrating os.path in tests)
    "PGH003",  # type: ignore needs specific codes (legacy code)
    "UP007",   # Use X | Y for type annotations (legacy code)
    "PLW1514", # encoding in open() (not critical in tests)
]
select = [
    "E",       # pycodestyle errors
    "F",       # pyflakes
    "W",       # pycodestyle warnings
    "B",       # flake8-bugbear
    "I",       # isort
    "C4",      # flake8-comprehensions
    "EM",      # flake8-errmsg
    "ICN",     # flake8-import-conventions
    "ISC",     # flake8-implicit-str-concat
    "G",       # flake8-logging-format
    "PGH",     # pygrep-hooks
    "PIE",     # flake8-pie
    "PL",      # pylint
    "PT",      # flake8-pytest-style
    "PTH",     # flake8-use-pathlib
    "RET",     # flake8-return
    "RUF",     # Ruff-specific
    "SIM",     # flake8-simplify
    "UP",      # pyupgrade
    "YTT",     # flake8-2020
    "EXE",     # flake8-executable
    "E303",    # Too many blank lines
]
unfixable = [
    "F841",    # Would remove unused variables
]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.coverage.report]
omit = [
    "src/mellowgate/plots/*",
    "src/mellowgate/utils/old_style_plot.py"
]

